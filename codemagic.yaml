workflows:
  android-release:
    name: Rihlaty Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - firebase_credentials # مجموعة متغيرات البيئة لـ Firebase (اختياري)
        - supabase_credentials # مجموعة متغيرات البيئة لـ Supabase (اختياري)
      vars:
        FLUTTER_VERSION: "3.22.0" # تحديد إصدار Flutter المستهدف
      flutter: stable
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > android/local.properties
      - name: Get Flutter packages
        script: |
          flutter pub cache clean -f
          rm -f pubspec.lock
          flutter pub get
      - name: Build Android APK
        script: |
          # تأكد من أنك قمت بإعداد مفاتيح التوقيع (Signing Keys) في واجهة Codemagic إذا كنت ترغب في رفع التطبيق للمتجر
          flutter build apk --release --build-name=1.0.0 --build-number=$(($BUILD_NUMBER + 100))
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - rihlaty.sd@gmail.com
