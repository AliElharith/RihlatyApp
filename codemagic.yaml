workflows:
  android-release-workflow:
    name: Android Release Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    
    environment:
      flutter: stable
      xcode: latest
      android_sdk: default
      
      groups:
        - keystore_credentials
        - firebase_config
        - api_keys
      
      vars:
        FLUTTER_VERSION: "stable"
        GRADLE_OPTS: "-Xmx8G -XX:MaxMetaspaceSize=4G"
        ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT
        ANDROID_HOME: $ANDROID_HOME
    
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties
      
      - name: Set up key.properties for signing
        script: |
          cat > android/key.properties << EOF
          storeFile=$KEYSTORE_PATH
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      
      - name: Set up google-services.json
        script: |
          cat > android/app/google-services.json << EOF
          $GOOGLE_SERVICES_JSON
          EOF
      
      - name: Set up environment variables for API keys
        script: |
          export MAPS_API_KEY=$MAPS_API_KEY
          export SUPABASE_URL=$SUPABASE_URL
          export SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
      
      - name: Get Flutter packages
        script: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs || true
      
      - name: Analyze Flutter code
        script: |
          flutter analyze --no-fatal-infos || true
      
      - name: Run tests (if available)
        script: |
          flutter test || true
      
      - name: Build Android APK (Release)
        script: |
          flutter build apk \
            --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER \
            --dart-define=MAPS_API_KEY=$MAPS_API_KEY \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
      
      - name: Build Android App Bundle (AAB)
        script: |
          flutter build appbundle \
            --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER \
            --dart-define=MAPS_API_KEY=$MAPS_API_KEY \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
    
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab
      - build/app/outputs/mapping/release/mapping.txt
    
    publishing:
      email:
        recipients:
          - $RELEASE_EMAIL
        notify:
          success: true
          failure: true
      
      slack:
        channel: $SLACK_CHANNEL
        notify_on_build_start: true
        notify:
          success: true
          failure: true
  
  android-debug-workflow:
    name: Android Debug Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    
    environment:
      flutter: stable
      xcode: latest
      android_sdk: default
    
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties
      
      - name: Get Flutter packages
        script: |
          flutter pub get
      
      - name: Build Android APK (Debug)
        script: |
          flutter build apk \
            --debug \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER
    
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
    
    publishing:
      email:
        recipients:
          - $DEBUG_EMAIL
        notify:
          success: true
          failure: true
