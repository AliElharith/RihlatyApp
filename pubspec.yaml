name: rihlaty_app
description: "تطبيق رحلتي - منصة ربط التجار بسائقي التكاتك لنقل البضائع"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  
  # State Management
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Navigation
  go_router: ^13.2.0
  
  # Maps & Location
  google_maps_flutter: ^2.6.1
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0
  geocoding: ^3.0.0
  
  # Authentication & Backend
  supabase_flutter: ^2.4.0
  
  # Storage & File Handling
  image_picker: ^1.0.7
  image_cropper: ^5.0.1
  
  # Notifications
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.19
  
  # Utilities
  intl: ^0.19.0
  dio: ^5.4.1
  uuid: ^4.3.3
  shared_preferences: ^2.2.2
  logger: ^2.2.0
  
  # Audio & Speech
  record: ^5.1.1
  speech_to_text: ^6.6.0
  
  # Image Compression
  image: ^4.1.7
  
  # Connectivity
  connectivity_plus: ^5.0.2
  
  # Real-time Updates
  web_socket_channel: ^2.4.3
  
  # QR Code
  qr_flutter: ^4.1.0
  
  # Date & Time
  table_calendar: ^3.1.0
  
  # Charts & Analytics
  fl_chart: ^0.66.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.11

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/
  
  fonts:
    - family: Thmanyah
      fonts:
        - asset: assets/fonts/thmanyahsans-Regular.otf
        - asset: assets/fonts/thmanyahsans-Bold.otf
          weight: 700
        - asset: assets/fonts/thmanyahsans-Medium.otf
          weight: 500
        - asset: assets/fonts/thmanyahsans-Light.otf
          weight: 300
        - asset: assets/fonts/thmanyahsans-Black.otf
          weight: 900
